# Plenipo test build: the logic-core unit tests and a simulator build of the dev scheme, on macOS.
# Device builds and TestFlight need the Plenipo Apple Developer team and are not run here yet.
name: Plenipo build

on:
  push:
    branches: ['plenipo/**', main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plenipo-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Simulator build of the app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build -project EudiReferenceWallet.xcodeproj -scheme "EUDI Wallet Dev" \
            -destination "generic/platform=iOS Simulator" -configuration Debug -derivedDataPath build \
            -skipPackagePluginValidation -skipMacroValidation CODE_SIGNING_ALLOWED=NO > build.log 2>&1 \
            || { grep -E "error:|warning: .*fatal|failed" build.log | head -80; exit 1; }
          tail -5 build.log
      - name: Mapping tests (logic-core-tests/TestPlenipoMandateDomain)
        shell: bash
        run: |
          set -o pipefail
          SIM=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r in d.values() for x in r if x["name"].startswith("iPhone")))')
          xcodebuild test -project EudiReferenceWallet.xcodeproj -scheme "EUDI Wallet Dev" \
            -destination "id=$SIM" -derivedDataPath build -only-testing:logic-core-tests/TestPlenipoMandateDomain \
            -skipPackagePluginValidation -skipMacroValidation CODE_SIGNING_ALLOWED=NO > test.log 2>&1 \
            || { grep -E "error|failed|XCTAssert" test.log | head -80; exit 1; }
          grep -E "Test Suite|Executed" test.log | tail -5
      - name: Zip the simulator app
        run: |
          APP=$(find build/Build/Products/Debug-iphonesimulator -name '*.app' -maxdepth 1 | head -1)
          ditto -c -k --keepParent "$APP" plenipo-eudi-wallet-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: plenipo-eudi-wallet-ios-simulator
          path: plenipo-eudi-wallet-simulator.zip
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: '*.log'
